# Le moteur de rendu est sans etat : ni base de donnees, ni volume de templates.
# Les modeles vivent dans la base Axiobat (table pdf_template) et arrivent dans la requete de rendu.
services:
  pdf-designer-api:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Stimulsoft__LicenseKey: "${STIMULSOFT_LICENSE_KEY:-}"
      Auth__Enabled: "true"
      Auth__SecretKey: "${AXIOBAT_JWT_SECRET:-}"
      # Uniquement pour le pont du designer (chargement/sauvegarde du .mrt) — le rendu n'appelle personne.
      Axiobat__ApiBaseUrl: "${AXIOBAT_API_BASE_URL:-}"
    ports:
      - "5290:8080"
